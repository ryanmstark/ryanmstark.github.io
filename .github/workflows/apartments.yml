name: Apartment Link Check

on:
  schedule:
    - cron: '17 */3 * * *'  # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-check posting links
        run: python _scripts/apartments/check_listings.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apartments/listings.json
          git diff --staged --quiet || git commit -m "Update apartment link check"
          git pull --rebase -X theirs
          git push
